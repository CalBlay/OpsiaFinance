<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpsiaFinance Preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="top-line"></div>

    <header class="app-header">
      <button class="header-icon" aria-label="Obrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="brand-center">
        <h1 class="brand-product"><span class="brand-opsia">Opsia</span><span class="brand-finance">Finance</span></h1>
      </div>

      <div class="header-actions">
        <button class="user-pill" aria-label="Usuari">O</button>
        <button class="header-arrow" aria-label="Sortir">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 6L16 12L10 18" />
            <path d="M16 12H4" />
          </svg>
        </button>
      </div>
    </header>

    <main class="page">
      <section class="module-grid">
        <article class="module-card module-card-settings">
          <div class="module-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="6" width="14" height="12" rx="3" />
              <path d="M9 3V9" />
              <path d="M15 15V21" />
              <path d="M9 9H9.01" />
              <path d="M15 15H15.01" />
            </svg>
          </div>
          <h3>Settings</h3>
        </article>

        <article class="module-card module-card-data">
          <div class="module-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 19V9" />
              <path d="M12 19V5" />
              <path d="M19 19V12" />
              <path d="M3 19H21" />
            </svg>
          </div>
          <h3>Dades</h3>
        </article>
      </section>
    </main>
  </body>
</html>
